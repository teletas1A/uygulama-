name: Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bagimliliklari kur
        run: npm install

      - name: Windows EXE olustur
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Kurulum dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: Guvenli-Bordro-Kurulum
          path: dist/*.exe
